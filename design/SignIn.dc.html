<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, "Helvetica Neue", sans-serif; background: #FBF6EE; }
    a { color: #A8663C; } a:hover { color: #8A5230; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="position: relative; width: 375px; height: 667px; overflow: hidden; background: #FBF6EE; color: #33302B; display: flex; flex-direction: column;">

  <!-- a quiet map, the day ramp read left to right -->
  <div style="height: 272px; flex-shrink: 0; position: relative; background: #F0E9DC;">
    <svg width="375" height="272" viewBox="30 60 330 240" style="display: block;">
      <rect width="390" height="396" fill="#F0E9DC"></rect>
      <path d="M0 306 C 78 288, 138 322, 208 310 C 282 297, 326 328, 390 314 L390 396 L0 396 Z" fill="#D9E4E3"></path>
      <path d="M232 44 C 292 38, 336 76, 338 128 C 340 182, 292 208, 248 194 C 204 180, 196 110, 232 44 Z" fill="#E2E9D7"></path>
      <g stroke="#E7DFD0" stroke-width="1" fill="none">
        <path d="M0 84 H390 M0 156 H390 M0 232 H390 M64 0 V306 M148 0 V306 M240 0 V306 M320 0 V306"></path>
      </g>
      <g stroke="#FCF9F2" stroke-linecap="round" fill="none">
        <path d="M-10 118 C 90 110, 152 178, 244 172 C 318 167, 352 212, 400 206" stroke-width="9"></path>
        <path d="M100 -10 C 108 84, 84 190, 112 268 C 138 340, 120 360, 132 410" stroke-width="9"></path>
        <path d="M276 -10 C 272 88, 296 168, 274 248 C 256 306, 272 330, 264 380" stroke-width="6"></path>
      </g>
      <!-- the trip, drawn as a thread through the day ramp -->
      <path d="M58 236 C 104 200, 134 250, 178 214 C 218 182, 236 246, 282 210 C 316 184, 330 132, 306 96" fill="none" stroke="#B0A794" stroke-width="1.6" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.8"></path>
    </svg>

    <div style="position: absolute; left: 58px; top: 236px; width: 17px; height: 17px; border-radius: 50%; background: #3F6B4A; border: 3px solid #FBF6EE; transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 118px; top: 212px; width: 15px; height: 15px; border-radius: 50%; background: #70864D; border: 3px solid #FBF6EE; transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 178px; top: 214px; width: 15px; height: 15px; border-radius: 50%; background: #AD8A49; border: 3px solid #FBF6EE; transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 232px; top: 232px; width: 15px; height: 15px; border-radius: 50%; background: #CE8845; border: 3px solid #FBF6EE; transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 282px; top: 210px; width: 15px; height: 15px; border-radius: 50%; background: #E0B054; border: 3px solid #FBF6EE; transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 306px; top: 96px; width: 14px; height: 14px; border-radius: 50%; background: #F0DCA6; border: 3px solid #FBF6EE; transform: translate(-50%, -50%);"></div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(to bottom, rgba(251,246,238,0), #FBF6EE);"></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 26px 26px;">

    <div style="margin-top: -16px;">
      <div style="font-family: Newsreader, Georgia, serif; font-size: 31px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.12;">Your trip,<br>on one map</div>
      <div style="font-size: 13px; color: #8C8479; line-height: 1.5; margin-top: 11px; max-width: 280px; text-wrap: pretty;">Everywhere you meant to go, grouped by day, greying out as you get there. Shared with whoever is coming.</div>
    </div>

    <span style="flex-grow: 1;"></span>

    <button style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid #E4D9C5; background: #FFFCF6; display: flex; align-items: center; justify-content: center; gap: 11px; cursor: pointer; box-shadow: 0 1px 3px rgba(80,66,44,0.08); padding: 0;">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed #C9BDA6; display: flex; align-items: center; justify-content: center; font-family: Figtree, sans-serif; font-size: 11px; font-weight: 700; color: #A59C90;">G</span>
      <span style="font-family: Figtree, sans-serif; font-size: 15px; font-weight: 600; color: #33302B;">Continue with Google</span>
    </button>

    <div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 13px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A59C90" stroke-width="1.9" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 22s8-3.5 8-10V5.5L12 2 4 5.5V12c0 6.5 8 10 8 10z"></path></svg>
      <span style="font-size: 11.5px; color: #9A9184; line-height: 1.5;">We ask for your name and email, nothing else. Photos and files stay on your device until you attach one.</span>
    </div>

    <div style="height: 1px; background: #EFE6D6; margin: 16px 0 13px;"></div>

    <div style="text-align: center;">
      <span style="font-size: 12.5px; color: #9A9184;">Someone sent you a link to look at? </span>
      <span style="font-size: 12.5px; font-weight: 600; color: #A8663C;">Open it without an account</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
