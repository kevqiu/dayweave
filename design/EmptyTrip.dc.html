<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, "Helvetica Neue", sans-serif; background: #FBF6EE; }
    a { color: #A8663C; } a:hover { color: #8A5230; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 667px; overflow: hidden; background: #FBF6EE; color: #33302B;">
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 30; display: flex; align-items: center; gap: 9px; padding: 0 12px; background: #FBF6EE; border-bottom: 1px solid #E9DFCE;">
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 5px;">
        <div style="font-family: Newsreader, Georgia, serif; font-size: 17px; font-weight: 500;">Japan, autumn</div>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#A59C90" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div style="font-size: 10.5px; color: #8C8479;">Sep 30 – Oct 10 · nothing planned yet</div>
    </div>
    <div style="display: flex;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #C4826A; color: #FFF9F0; font-size: 9.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #FBF6EE;">KQ</div>
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #6E8CA8; color: #FFF9F0; font-size: 9.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #FBF6EE; margin-left: -8px;">MT</div>
    </div>
    <button title="Invite someone" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; border: 1px solid #E4D9C5; background: #FFFCF6; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B645B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.4"></circle><path d="M3.2 19.5a6.6 6.6 0 0 1 12.6 0M18.5 8.5v5M21 11h-5"></path></svg>
    </button>
  </div>

  <div style="position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: #EFE8DB;">
      <svg width="375" height="500" viewBox="0 0 390 520" style="display: block;">
        <rect x="0" y="0" width="390" height="520" fill="#F0E9DC"></rect>
        <path d="M0 392 C 70 372, 128 412, 196 400 C 268 388, 318 424, 390 404 L390 520 L0 520 Z" fill="#D9E4E3"></path>
        <path d="M244 44 C 296 40, 336 70, 340 116 C 344 164, 300 188, 258 178 C 216 168, 204 112, 244 44 Z" fill="#E2E9D7"></path>
        <path d="M28 200 C 62 190, 92 208, 90 236 C 88 262, 54 274, 32 258 C 12 244, 8 212, 28 200 Z" fill="#E2E9D7"></path>
        <g stroke="#FCF9F2" stroke-linecap="round" fill="none">
          <path d="M-10 120 C 90 112, 150 178, 240 172 C 316 167, 350 210, 400 204" stroke-width="9"></path>
          <path d="M108 -10 C 116 86, 92 190, 120 268 C 146 340, 128 400, 140 530" stroke-width="9"></path>
          <path d="M272 -10 C 268 90, 292 170, 272 250 C 254 322, 270 366, 262 430" stroke-width="7"></path>
          <path d="M-10 300 C 80 292, 176 322, 268 306 C 330 296, 356 312, 400 306" stroke-width="6"></path>
        </g>
        <g fill="#9A9184" font-family="Figtree, sans-serif" font-size="9.5" letter-spacing="0.05em">
          <text x="264" y="120">OHORI PARK</text><text x="148" y="296">NAKASU</text>
        </g>
      </svg>

    <div style="position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 7px; background: rgba(255,252,246,0.94); border: 1px solid #E4D9C5; border-radius: 999px; padding: 5px 11px 5px 9px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A59C90" stroke-width="2" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"></path></svg>
      <span style="font-size: 10.5px; color: #9A9184;">no stops on the map yet</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 312px; background: #FBF6EE; border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(84,68,44,0.16); display: flex; flex-direction: column; border-top: 1px solid #EFE6D6;">
    <div style="padding: 7px 0 4px; display: flex; justify-content: center;"><div style="width: 36px; height: 4px; border-radius: 3px; background: #DCD1BD;"></div></div>

    <div style="flex-grow: 1; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 40px; background: #F6EFE2; border-bottom: 1px solid #EFE6D6;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #57794C;"></span>
        <div style="display: flex; flex-direction: column; flex-grow: 1;">
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-size: 12.5px; font-weight: 700;">Fri Oct 2</span>
            <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.07em; color: #4E7A4B; background: #E4EEE1; border-radius: 4px; padding: 2px 4px;">TODAY</span>
          </div>
        </div>
        <span style="font-size: 10px; color: #A8A093;">0/0</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A59C90" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>

      <div style="padding: 22px 20px 16px; text-align: center;">
        <div style="font-family: Newsreader, Georgia, serif; font-size: 17px; font-weight: 500;">Nothing here yet</div>
        <div style="font-size: 11.5px; color: #9A9184; line-height: 1.5; margin-top: 5px;">Add somewhere you want to go, or bring in the places you have already saved.</div>
        <div style="display: flex; gap: 7px; margin-top: 15px;">
          <button style="flex-grow: 1; height: 38px; border-radius: 10px; border: none; background: #33302B; color: #FBF6EE; font-family: Figtree, sans-serif; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBF6EE" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
            Find a place
          </button>
          <button style="flex-grow: 1; height: 38px; border-radius: 10px; border: 1px solid #E9DFCE; background: #FFFCF6; color: #6B645B; font-family: Figtree, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer;">Bring in a My Map</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 36px; border-top: 1px solid #F1E9DA;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #70864D; opacity: 0.45;"></span>
        <span style="font-size: 12.5px; color: #6B645B; flex-grow: 1;">Sat Oct 3</span>
        <span style="font-size: 10px; color: #A8A093;">0/0</span>
      </div>
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 36px; border-top: 1px solid #F1E9DA;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #8C8C4C; opacity: 0.45;"></span>
        <span style="font-size: 12.5px; color: #6B645B; flex-grow: 1;">Sun Oct 4</span>
        <span style="font-size: 10px; color: #A8A093;">0/0</span>
      </div>
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 36px; border-top: 1px solid #F1E9DA;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #94897A; opacity: 0.45;"></span>
        <span style="font-size: 12.5px; color: #6B645B; flex-grow: 1;">To be planned</span>
        <span style="font-size: 10px; color: #A8A093;">0</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
