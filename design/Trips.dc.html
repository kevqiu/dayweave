<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, "Helvetica Neue", sans-serif; background: #FBF6EE; }
    a { color: #A8663C; } a:hover { color: #8A5230; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 667px; overflow: hidden; background: #FBF6EE; color: #33302B;">

  <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px;">
    <div style="font-family: Newsreader, Georgia, serif; font-size: 21px; font-weight: 500; flex-grow: 1;">Trips</div>
    <button style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #E9DFCE; background: #C4826A; color: #FFF9F0; font-family: Figtree, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; padding: 0;">KQ</button>
  </div>

  <!-- pending invite -->
  <div style="margin: 0 14px 12px; border-radius: 14px; border: 1.5px solid #DCC58A; background: #FCF6E6; padding: 10px 12px; display: flex; align-items: center; gap: 10px;">
    <div style="width: 32px; height: 32px; border-radius: 50%; background: #6E8CA8; color: #FFF9F0; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">MT</div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
      <span style="font-size: 12.5px; font-weight: 600;">Mika invited you to Korea</span>
      <span style="font-size: 10.5px; color: #97803F;">Mar 2026</span>
    </div>
    <button style="height: 30px; border-radius: 8px; border: none; background: #33302B; color: #FBF6EE; font-family: Figtree, sans-serif; font-size: 12px; font-weight: 600; padding: 0 13px; cursor: pointer;">Join</button>
  </div>

  <div style="padding: 0 16px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #A8A093;">HAPPENING NOW</div>

  <div style="margin: 0 14px 12px; border-radius: 16px; border: 1.5px solid #C6DBC2; background: #FFFCF6; overflow: hidden;">
    <div style="height: 62px; background: #E9F1E6; position: relative; overflow: hidden;">
      <svg width="345" height="62" viewBox="0 0 360 78" preserveAspectRatio="xMidYMid slice" style="display: block;">
        <rect width="360" height="78" fill="#E4EEE1"></rect>
        <path d="M0 58 C 70 50, 130 66, 200 58 C 268 50, 310 66, 360 58 L360 78 L0 78 Z" fill="#D4E4D0"></path>
        <g stroke="#F4F9F2" stroke-width="5" fill="none" stroke-linecap="round"><path d="M-10 26 C 80 20, 140 44, 230 38 C 290 34, 330 46, 370 42"></path><path d="M104 -8 C 110 30, 92 58, 116 86"></path></g>
      </svg>
      <div style="position: absolute; left: 64px; top: 20px; width: 15px; height: 15px; border-radius: 50%; background: #BDB4A7; border: 2.5px solid #FFFCF6;"></div>
      <div style="position: absolute; left: 148px; top: 34px; width: 15px; height: 15px; border-radius: 50%; background: #6F9A6B; border: 2.5px solid #FFFCF6;"></div>
      <div style="position: absolute; left: 226px; top: 22px; width: 15px; height: 15px; border-radius: 50%; background: #E0B355; border: 2.5px solid #FFFCF6;"></div>
      <div style="position: absolute; left: 290px; top: 44px; width: 15px; height: 15px; border-radius: 50%; background: #E0B355; border: 2.5px solid #FFFCF6;"></div>
      <span style="position: absolute; right: 12px; top: 11px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; color: #4E7A4B; background: rgba(255,252,246,0.92); border-radius: 5px; padding: 3px 7px;">DAY 3 OF 11</span>
    </div>
    <div style="padding: 11px 13px 13px;">
      <div style="font-family: Newsreader, Georgia, serif; font-size: 17px; font-weight: 500;">Japan, autumn</div>
      <div style="font-size: 11.5px; color: #9A9184; margin-top: 3px;">Sep 30 – Oct 10 · Fukuoka, Kagoshima, Hakone</div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
        <div style="display: flex;">
          <div style="width: 24px; height: 24px; border-radius: 50%; background: #C4826A; color: #FFF9F0; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFCF6;">KQ</div>
          <div style="width: 24px; height: 24px; border-radius: 50%; background: #6E8CA8; color: #FFF9F0; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFCF6; margin-left: -8px;">MT</div>
          <div style="width: 24px; height: 24px; border-radius: 50%; background: #8A83AE; color: #FFF9F0; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFCF6; margin-left: -8px;">JL</div>
        </div>
        <span style="flex-grow: 1;"></span>
        <span style="font-size: 11px; color: #9A9184; font-variant-numeric: tabular-nums;">12 of 46 visited</span>
      </div>
      <div style="height: 5px; border-radius: 3px; background: #EFE6D6; margin-top: 8px; overflow: hidden;"><div style="width: 26%; height: 100%; background: #6F9A6B;"></div></div>
    </div>
  </div>

  <div style="padding: 0 16px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #A8A093;">COMING UP</div>

  <div style="margin: 0 14px 10px; border-radius: 14px; border: 1px solid #E4D9C5; background: #FFFCF6; padding: 10px 13px; display: flex; align-items: center; gap: 11px;">
    <div style="width: 42px; height: 42px; border-radius: 11px; background: #F8EECF; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="font-size: 8.5px; font-weight: 700; color: #96752F; letter-spacing: 0.06em;">APR</span>
      <span style="font-size: 14px; font-weight: 700; color: #6B5426; line-height: 1;">11</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
      <span style="font-size: 14.5px; font-weight: 600;">Portugal, spring</span>
      <span style="font-size: 11px; color: #9A9184;">Apr 11 – 22</span>
    </div>
    <div style="display: flex;">
      <div style="width: 22px; height: 22px; border-radius: 50%; background: #C4826A; color: #FFF9F0; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFCF6;">KQ</div>
      <div style="width: 22px; height: 22px; border-radius: 50%; background: #A87A93; color: #FFF9F0; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFCF6; margin-left: -7px;">SR</div>
    </div>
  </div>

  <div style="padding: 10px 16px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #A8A093;">PAST</div>

  <div style="margin: 0 14px 8px; border-radius: 14px; border: 1px solid #F1E9DA; padding: 9px 13px; display: flex; align-items: center; gap: 11px; opacity: 0.7;">
    <div style="width: 38px; height: 38px; border-radius: 11px; background: #F0E9DC; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="font-size: 8px; font-weight: 700; color: #A8A093; letter-spacing: 0.06em;">MAY</span>
      <span style="font-size: 13px; font-weight: 700; color: #8C8479; line-height: 1;">03</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 13.5px; font-weight: 500; color: #6B645B;">Taipei</span>
      <span style="font-size: 10.5px; color: #A8A093;">May 2025 · Taipei, Jiufen</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px 18px; background: linear-gradient(to top, #FBF6EE 68%, rgba(251,246,238,0));">
    <button style="width: 100%; height: 40px; border-radius: 10px; border: none; background: #33302B; color: #FBF6EE; font-family: Figtree, sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBF6EE" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Start a new trip
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
