<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Architects Daughter", "Comic Sans MS", cursive; background: #FAF8F4; }
    a { color: #A8663C; } a:hover { color: #8A5230; }
    * { box-sizing: border-box; }
    .lbl { font-family: Figtree, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #9A9184; }
    .box { border: 1.6px solid #8E877D; border-radius: 6px; }
    .dash { border: 1.6px dashed #B3ABA0; border-radius: 6px; }
    .ln { height: 7px; border-radius: 4px; background: #D8D2C7; }
  </style>
</helmet>
<div style="width: 320px; height: 640px; background: #FAF8F4; padding: 18px 16px; color: #4A443C; display: flex; flex-direction: column; gap: 10px;">
  <div>
    <div class="lbl">DIRECTION B</div>
    <div style="font-size: 20px; margin-top: 2px;">Day rail</div>
    <div style="font-family: Figtree, sans-serif; font-size: 11px; color: #8C8479; line-height: 1.5; margin-top: 4px;">Days are chips on a rail above the sheet. One day at a time, swipe sideways.</div>
  </div>

  <div class="box" style="flex-grow: 1; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 34px; border-bottom: 1.6px solid #8E877D; display: flex; align-items: center; padding: 0 10px; gap: 7px;">
      <span class="ln" style="width: 70px;"></span><span style="flex-grow: 1;"></span>
      <span style="width: 16px; height: 16px; border-radius: 50%; background: #D8D2C7;"></span>
    </div>

    <div style="height: 40px; border-bottom: 1.6px solid #8E877D; display: flex; align-items: center; gap: 6px; padding: 0 10px; overflow: hidden;">
      <div style="height: 24px; border-radius: 999px; background: #EFE9DF; display: flex; align-items: center; padding: 0 9px; gap: 5px; flex-shrink: 0;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #C4826A;"></span><span style="font-family: Figtree, sans-serif; font-size: 10px; color: #9A9184;">Oct 1</span></div>
      <div style="height: 28px; border-radius: 999px; background: #4A443C; display: flex; align-items: center; padding: 0 11px; gap: 5px; flex-shrink: 0;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #E0B355;"></span><span style="font-family: Figtree, sans-serif; font-size: 10.5px; font-weight: 700; color: #FFF;">Oct 2</span></div>
      <div style="height: 24px; border-radius: 999px; border: 1.4px solid #C9C2B6; display: flex; align-items: center; padding: 0 9px; gap: 5px; flex-shrink: 0;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #8E9A57;"></span><span style="font-family: Figtree, sans-serif; font-size: 10px; color: #6B645B;">Oct 3</span></div>
      <div style="height: 24px; border-radius: 999px; border: 1.4px solid #C9C2B6; display: flex; align-items: center; padding: 0 9px; gap: 5px; flex-shrink: 0;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #6E9A78;"></span><span style="font-family: Figtree, sans-serif; font-size: 10px; color: #6B645B;">Oct 4</span></div>
      <div style="height: 24px; width: 26px; border-radius: 999px; border: 1.4px dashed #C9C2B6; flex-shrink: 0;"></div>
    </div>

    <div style="height: 250px; background: #F1EEE7; border-bottom: 1.6px solid #8E877D; position: relative;">
      <svg width="100%" height="250" viewBox="0 0 288 250"><g stroke="#DCD6CA" stroke-width="6" fill="none" stroke-linecap="round"><path d="M-10 84 C 80 76, 130 142, 200 134 C 250 128, 270 168, 300 162"></path><path d="M92 -10 C 98 84, 78 168, 100 250"></path></g></svg>
      <div style="position: absolute; left: 66px; top: 66px; width: 20px; height: 20px; border-radius: 50%; background: #7FA87F; border: 2.5px solid #FFF;"></div>
      <div style="position: absolute; left: 152px; top: 108px; width: 20px; height: 20px; border-radius: 50%; background: #7FA87F; border: 2.5px solid #FFF;"></div>
      <div style="position: absolute; left: 198px; top: 176px; width: 20px; height: 20px; border-radius: 50%; background: #7FA87F; border: 2.5px solid #FFF;"></div>
      <div style="position: absolute; left: 104px; top: 190px; width: 20px; height: 20px; border-radius: 50%; background: #B9B2A8; border: 2.5px solid #FFF;"></div>
    </div>

    <div style="flex-grow: 1; padding: 9px 10px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #B9B2A8;"></span></div>
      <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1; background: #8E877D;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #7FA87F;"></span></div>
      <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #7FA87F;"></span></div>
      <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #E0B355;"></span></div>
    </div>
  </div>

  <div style="font-family: Figtree, sans-serif; font-size: 10.5px; line-height: 1.55; color: #6B645B;">
    <strong style="color: #4E7A4B;">Good:</strong> the day's list starts at the top, no header noise, scales to a 30-day trip.<br>
    <strong style="color: #A06B52;">Cost:</strong> you cannot see two days at once, and drag-to-another-day needs a different gesture.
  </div>
</div>
</x-dc>
</body>
</html>
