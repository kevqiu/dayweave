<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Architects Daughter", "Comic Sans MS", cursive; background: #FAF8F4; }
    a { color: #A8663C; } a:hover { color: #8A5230; }
    * { box-sizing: border-box; }
    .lbl { font-family: Figtree, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #9A9184; }
    .box { border: 1.6px solid #8E877D; border-radius: 6px; }
    .dash { border: 1.6px dashed #B3ABA0; border-radius: 6px; }
    .ln { height: 7px; border-radius: 4px; background: #D8D2C7; }
  </style>
</helmet>
<div style="width: 320px; height: 640px; background: #FAF8F4; padding: 18px 16px; color: #4A443C; display: flex; flex-direction: column; gap: 10px;">
  <div>
    <div class="lbl">DIRECTION A</div>
    <div style="font-size: 20px; margin-top: 2px;">Accordion sheet</div>
    <div style="font-family: Figtree, sans-serif; font-size: 11px; color: #8C8479; line-height: 1.5; margin-top: 4px;">Days stack in the sheet, one open at a time. Everything lives in one scroll.</div>
  </div>

  <div class="box" style="flex-grow: 1; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 34px; border-bottom: 1.6px solid #8E877D; display: flex; align-items: center; padding: 0 10px; gap: 7px;">
      <span class="ln" style="width: 70px;"></span><span style="flex-grow: 1;"></span>
      <span style="width: 16px; height: 16px; border-radius: 50%; background: #D8D2C7;"></span>
      <span style="width: 16px; height: 16px; border-radius: 50%; background: #D8D2C7;"></span>
    </div>
    <div style="height: 210px; background: #F1EEE7; border-bottom: 1.6px solid #8E877D; position: relative;">
      <svg width="100%" height="210" viewBox="0 0 288 210"><g stroke="#DCD6CA" stroke-width="6" fill="none" stroke-linecap="round"><path d="M-10 70 C 80 62, 130 118, 200 112 C 250 108, 270 140, 300 136"></path><path d="M92 -10 C 98 70, 78 140, 100 210"></path></g></svg>
      <div style="position: absolute; left: 66px; top: 56px; width: 18px; height: 18px; border-radius: 50%; background: #7FA87F; border: 2.5px solid #FFF;"></div>
      <div style="position: absolute; left: 148px; top: 92px; width: 18px; height: 18px; border-radius: 50%; background: #7FA87F; border: 2.5px solid #FFF;"></div>
      <div style="position: absolute; left: 196px; top: 150px; width: 18px; height: 18px; border-radius: 50%; background: #7FA87F; border: 2.5px solid #FFF;"></div>
      <div style="position: absolute; left: 108px; top: 160px; width: 13px; height: 13px; border-radius: 50%; background: #D8D2C7;"></div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <div style="height: 30px; background: #EFE9DF; border-bottom: 1.2px solid #C9C2B6; display: flex; align-items: center; gap: 7px; padding: 0 10px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #C4826A;"></span>
        <span class="ln" style="width: 54px; background: #B9B2A8;"></span><span style="flex-grow: 1;"></span>
        <span style="font-family: Figtree, sans-serif; font-size: 12px; color: #9A9184;">+</span>
      </div>
      <div style="height: 30px; background: #FBF3DE; border-bottom: 1.2px solid #C9C2B6; display: flex; align-items: center; gap: 7px; padding: 0 10px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #B98F4E;"></span>
        <span class="ln" style="width: 62px; background: #8E877D;"></span><span style="flex-grow: 1;"></span>
        <span style="font-family: Figtree, sans-serif; font-size: 12px; color: #9A9184;">&minus;</span>
      </div>
      <div style="padding: 7px 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #B9B2A8;"></span></div>
        <div class="box" style="padding: 7px 8px; display: flex; flex-direction: column; gap: 6px; background: #FFFDF8;">
          <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1; background: #8E877D;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #7FA87F;"></span></div>
          <div style="display: flex; gap: 5px;"><span class="box" style="flex-grow: 1; height: 20px; background: #4A443C;"></span><span class="box" style="flex-grow: 1; height: 20px;"></span><span class="box" style="width: 24px; height: 20px;"></span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;"><span class="ln" style="width: 22px;"></span><span class="ln" style="flex-grow: 1;"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: #E0B355;"></span></div>
      </div>
      <div style="height: 26px; background: #F5F2EB; border-top: 1.2px solid #C9C2B6; display: flex; align-items: center; gap: 7px; padding: 0 10px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #8E9A57;"></span>
        <span class="ln" style="width: 50px;"></span>
      </div>
    </div>
  </div>

  <div style="font-family: Figtree, sans-serif; font-size: 10.5px; line-height: 1.55; color: #6B645B;">
    <strong style="color: #4E7A4B;">Good:</strong> one mental model, days always reachable, expands to full screen cleanly.<br>
    <strong style="color: #A06B52;">Cost:</strong> with 11 days the headers eat the sheet; you scroll past chrome to reach tomorrow.
  </div>
</div>
</x-dc>
</body>
</html>
